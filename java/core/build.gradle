[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api 'com.esotericsoftware:kryonet:2.22.0-RC1'

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  implementation group: 'ar.com.hjg', name: 'pngj', version: '2.1.0'
  implementation "com.strongjoshua:libgdx-inGameConsole:1.0.0"
}

// Input lifecycle regressions run without a physical gamepad or graphics context.
tasks.register('controllerRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.framework.ControllerRegressionTest'
}
check.dependsOn controllerRegressionTest

// Player actions and the dedicated switch action must never share a control hand-off path.
tasks.register('playerControlRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.match.PlayerControlRegressionTest'
}
check.dependsOn playerControlRegressionTest

// Coach intents are verified against the production positioning and decision policies.
tasks.register('tacticalStateRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.match.TacticalStateRegressionTest'
}
check.dependsOn tacticalStateRegressionTest

// Ownership-frame phase transitions and phase-aware tactical trends are deterministic headlessly.
tasks.register('teamPhaseRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.match.TeamPhaseRegressionTest'
}
check.dependsOn teamPhaseRegressionTest

// Match-view projection tests require neither a graphics context nor physical input hardware.
tasks.register('matchViewRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.match.MatchViewTransformRegressionTest'
}
check.dependsOn matchViewRegressionTest

tasks.register('warningRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.screens.CompetitionWarningRegressionTest'
  args rootProject.file('assets/i18n').absolutePath
}
check.dependsOn warningRegressionTest

// Automatic score generation can be checked without running the match scene.
tasks.register('goalsRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.match.GoalsRegressionTest'
}
check.dependsOn goalsRegressionTest

// Optional fixed-seed balance report; it reads bundled squads without changing saved games.
tasks.register('goalsCalibrationReport', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.match.GoalsCalibrationReport'
  args rootProject.file('assets/data/teams').absolutePath,
    layout.buildDirectory.file('reports/goals-calibration.md').get().asFile.absolutePath
}
