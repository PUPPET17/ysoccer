[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api 'com.esotericsoftware:kryonet:2.22.0-RC1'

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  implementation group: 'ar.com.hjg', name: 'pngj', version: '2.1.0'
  implementation "com.strongjoshua:libgdx-inGameConsole:1.0.0"
}

// Input lifecycle regressions run without a physical gamepad or graphics context.
tasks.register('controllerRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.framework.ControllerRegressionTest'
}
check.dependsOn controllerRegressionTest

tasks.register('warningRegressionTest', JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'com.ygames.ysoccer.screens.CompetitionWarningRegressionTest'
  args rootProject.file('assets/i18n').absolutePath
}
check.dependsOn warningRegressionTest
